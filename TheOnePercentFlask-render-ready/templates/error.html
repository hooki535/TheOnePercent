<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{ code }} — TheOnePercent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0d12;
      color: #e6e8ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    .box { max-width: 420px; padding: 24px; }
    .code { font-size: 13px; letter-spacing: .08em; color: #7e96ff; text-transform: uppercase; }
    h1 { font-size: 22px; margin: 10px 0 6px; }
    p { color: #9aa1b2; line-height: 1.5; margin: 0 0 20px; }
    a {
      display: inline-block;
      padding: 9px 16px;
      border-radius: 8px;
      background: #3654ff;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">Error {{ code }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a href="{{ url_for('pages.index') }}">Back to the dashboard</a>
  </div>
</body>
</html>
