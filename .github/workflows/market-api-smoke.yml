name: Live market API smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check health endpoint
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url = "https://theonepercent-market-api.onrender.com/health"
          for attempt in range(5):
              try:
                  with urllib.request.urlopen(url, timeout=45) as response:
                      assert response.status == 200
                      data = json.load(response)
                      assert data["status"] == "ok"
                  print("Backend health verified")
                  break
              except Exception:
                  if attempt == 4:
                      raise
                  time.sleep(15)
          PY
      - name: Verify provider-backed historical BTC candles
        run: |
          python - <<'PY'
          import json, urllib.request
          url = "https://theonepercent-market-api.onrender.com/api/candles/BTCUSD/1H?limit=5"
          with urllib.request.urlopen(url, timeout=60) as response:
              assert response.status == 200
              body = json.load(response)
          assert body["source"] == "Binance spot", body
          assert body["market"] == "spot", body
          assert len(body["candles"]) == 5, body
          for b in body["candles"]:
              assert b["t"] > 1_000_000_000
              assert 0 < b["l"] <= min(b["o"], b["c"]) <= max(b["o"], b["c"]) <= b["h"]
          print("Verified five real provider-backed spot candles")
          PY
