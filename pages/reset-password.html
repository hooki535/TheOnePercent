<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset password — TheOnePercent</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="../assets/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/cloud.js"></script>
<link rel="stylesheet" href="../assets/shell.css" />
<link rel="stylesheet" href="../assets/components.css" />
<link rel="stylesheet" href="../assets/auth.css" />
</head>
<body data-page="login" data-depth="1" data-auth="out">
<main class="wrap" style="max-width:420px;padding:64px 16px;">
  <div class="auth-panel">
    <h2>Choose a new password</h2>
    <form id="reset-form" novalidate>
      <label class="auth-field"><span>New password</span>
        <input type="password" id="new-pw" minlength="8" required placeholder="At least 8 characters" /></label>
      <p class="auth-error" id="msg"></p>
      <button type="submit" class="btn btn-primary btn-lg">Save password</button>
    </form>
  </div>
</main>
<script>
document.getElementById("reset-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = document.getElementById("new-pw").value, msg = document.getElementById("msg");
  if (pw.length < 8) { msg.textContent = "Password must be at least 8 characters."; return; }
  const { error } = await Cloud.client.auth.updateUser({ password: pw });
  if (error) { msg.textContent = "This reset link has expired. Request a new one from the log-in page."; return; }
  location.href = "dashboard.html";
});
</script>
</body>
</html>
